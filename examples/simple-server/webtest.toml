[project]
name = "simple-server"
test_roots = ["."]

[browser]
headless = true
channel = "managed"
base_url = "http://127.0.0.1:3001"
viewport = { width = 1440, height = 900 }
test_id_attribute = "data-testid"

[server]
base_url = "http://127.0.0.1:3001"

[server.http]
follow_redirects = true
max_response_bytes = 1048576

[timeouts]
browser_command = "10s"
action = "5s"
assertion = "5s"
navigation = "30s"
provider_call = "60s"
test = "60s"

[artifacts]
directory = ".webtest/artifacts"

[evidence]
screenshot = "on-failure"
dom_snapshot = "on-failure"
max_dom_bytes = 1048576
