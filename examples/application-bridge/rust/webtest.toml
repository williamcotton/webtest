[project]
name = "application-bridge-rust"
test_roots = ["created-user.webtest"]

[app]
command = "cargo"
args = ["run", "--quiet"]
working_directory = "."

[app.environment]
WEBTEST = "1"
PORT = "3108"

[app.health]
url = "http://127.0.0.1:3108/health"
timeout = "20s"

[server.app]
adapter = "bridge"
transport = "tcp"
schema = ".webtest/app-schema.json"
startup_timeout = "60s"

[browser]
base_url = "http://127.0.0.1:3108"
