[project]
name = "application-bridge-node"
test_roots = ["created-user.webtest"]

[app]
command = "node"
args = ["--experimental-strip-types", "server.ts"]
working_directory = "."

[app.environment]
NODE_ENV = "test"
WEBTEST = "1"
PORT = "3101"

[app.health]
url = "http://127.0.0.1:3101/health"
timeout = "10s"

[server.app]
adapter = "bridge"
transport = "tcp"
schema = ".webtest/app-schema.json"
startup_timeout = "60s"

[browser]
base_url = "http://127.0.0.1:3101"
