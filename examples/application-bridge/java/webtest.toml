[project]
name = "application-bridge-java"
test_roots = ["created-user.webtest"]

[app]
command = "java"
args = ["Main.java"]
working_directory = "."

[app.environment]
WEBTEST = "1"
PORT = "3106"

[app.health]
url = "http://127.0.0.1:3106/health"
timeout = "20s"

[server.app]
adapter = "bridge"
transport = "tcp"
schema = ".webtest/app-schema.json"
startup_timeout = "60s"

[browser]
base_url = "http://127.0.0.1:3106"
