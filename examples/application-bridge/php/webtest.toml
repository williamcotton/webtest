[project]
name = "application-bridge-php"
test_roots = ["created-user.webtest"]

[app]
command = "php"
args = ["app.php"]
working_directory = "."

[app.environment]
WEBTEST = "1"
PORT = "3109"

[app.health]
url = "http://127.0.0.1:3109/health"
timeout = "20s"

[server.app]
adapter = "bridge"
transport = "tcp"
schema = ".webtest/app-schema.json"
startup_timeout = "60s"

[browser]
base_url = "http://127.0.0.1:3109"
