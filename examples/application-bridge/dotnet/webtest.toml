[project]
name = "application-bridge-dotnet"
test_roots = ["created-user.webtest"]

[app]
command = "dotnet"
args = ["run", "--project", "App.csproj", "--no-launch-profile"]
working_directory = "."

[app.environment]
WEBTEST = "1"
PORT = "3107"

[app.health]
url = "http://127.0.0.1:3107/health"
timeout = "20s"

[server.app]
adapter = "bridge"
transport = "tcp"
schema = ".webtest/app-schema.json"
startup_timeout = "60s"

[browser]
base_url = "http://127.0.0.1:3107"
