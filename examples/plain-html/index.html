<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebTest Manual Fixture</title>
</head>
<body>
    <h1>WebTest Manual Fixture</h1>
    <p>This page contains the button used by the example tests.</p>
    <button id="submit" type="button">Submit</button>
    <hr>
    <form id="sign-in">
        <label>Email <input type="email" autocomplete="username"></label>
        <label>Password <input type="password" autocomplete="current-password"></label>
        <label>Biography <textarea></textarea></label>
        <label>Search <input type="search" placeholder="Search products"></label>
        <label>Email notifications <input type="checkbox"></label>
        <label>SMS notifications <input type="checkbox" checked></label>
        <label>Timezone
            <select>
                <option value="America/Chicago">America/Chicago</option>
                <option value="UTC">UTC</option>
            </select>
        </label>
        <button type="submit">Sign in</button>
    </form>
    <script>
        document.getElementById("submit").addEventListener("click", () => {
            const result = document.createElement("div");
            result.textContent = "submitted";
            document.body.append(result);
        });
        document.querySelector("#sign-in button").addEventListener("click", (event) => {
            event.preventDefault();
            history.pushState({}, "", "/dashboard");
            const result = document.createElement("div");
            result.textContent = "Welcome, Alice";
            document.body.append(result);
        });
    </script>
</body>
</html>
