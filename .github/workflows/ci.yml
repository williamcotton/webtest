name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  quality-suite:
    name: Complete Quality Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Check bridge projections and conformance
        run: |
          python3 protocol/conformance/generate.py --check
          python3 protocol/conformance/harness.py
          python3 protocol/conformance/harness.py node sdks/node/conformance.js
          python3 protocol/conformance/harness.py ruby sdks/ruby/conformance.rb

      - name: Allow downloaded Chrome sandbox
        if: runner.os == 'Linux'
        run: |
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace
        env:
          WEBTEST_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Check workspace responsiveness and invalidation budgets
        run: cargo run --release -p webtest-analysis --example workspace_benchmark -- --check

      - name: Check WASM target
        run: cargo check -p webtest-wasm -p webtest-trace --target wasm32-unknown-unknown

      - name: Build webtest binary
        run: cargo build

      - name: Install VS Code extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Test Testing API selection and result routing
        run: npm run test:testing
        working-directory: editors/vscode

      - name: Run VS Code extension VSIX smoke test
        run: npm run smoke
        working-directory: editors/vscode

      - name: Run VS Code extension activation smoke test
        run: xvfb-run npm run smoke:activation
        working-directory: editors/vscode
        env:
          WEBTEST_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Build portable editor package
        run: |
          cargo install wasm-bindgen-cli --version "$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock","rb"))["package"] if p["name"] == "wasm-bindgen"))')" --locked
          npm --prefix editors/monaco ci
          npm --prefix editors/monaco run build

      - name: Native/WASM DTO parity and worker lifecycle
        run: npm --prefix editors/monaco test

      - name: Real worker and Monaco browser integration
        run: npm --prefix editors/monaco run test:browser
        env:
          WEBTEST_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Release package and installer validation
        run: |
          python3 scripts/release/test_package.py
          npm --prefix editors/vscode run test:releases
          sh -n release/install.sh
