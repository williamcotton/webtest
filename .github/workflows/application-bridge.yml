name: application bridge examples

on:
  push:
    paths: ["crates/**", "protocol/**", "sdks/**", "examples/application-bridge/**", "scripts/check-application-bridge-examples.py"]
  pull_request:
    paths: ["crates/**", "protocol/**", "sdks/**", "examples/application-bridge/**", "scripts/check-application-bridge-examples.py"]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        example: [node, ruby, go, python, elixir, java, dotnet, rust, php]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: browser-actions/setup-chrome@v1
      - if: matrix.example == 'node'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: matrix.example == 'node'
        run: npm ci --prefix examples/application-bridge/node
      - if: matrix.example == 'node'
        run: npm run check:types --prefix examples/application-bridge/node
      - if: matrix.example == 'ruby'
        uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - if: matrix.example == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - if: matrix.example == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: matrix.example == 'elixir'
        uses: erlef/setup-beam@v1
        with: { elixir-version: '1.17', otp-version: '27' }
      - if: matrix.example == 'java'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - if: matrix.example == 'dotnet'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - if: matrix.example == 'php'
        uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - run: cargo build
      - run: python3 protocol/conformance/generate.py --check
      - if: matrix.example != 'node'
        run: python3 scripts/check-application-bridge-examples.py --example ${{ matrix.example }} --smoke --require-toolchain
        env:
          WEBTEST_CHROME_PATH: ${{ env.CHROME_PATH }}
      - if: matrix.example == 'node'
        run: python3 scripts/check-application-bridge-examples.py --example node --smoke --cleanup-cases --require-toolchain
        env:
          WEBTEST_CHROME_PATH: ${{ env.CHROME_PATH }}

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: python3 protocol/conformance/harness.py
      - run: python3 protocol/conformance/harness.py node sdks/node/conformance.js
      - run: python3 protocol/conformance/harness.py ruby sdks/ruby/conformance.rb

  windows-transport-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo check -p webtest-app-bridge --all-targets
      - run: npm test --prefix sdks/node
