[workspace]
resolver = "2"
members = [
    "crates/text",
    "crates/syntax",
    "crates/hir",
    "crates/analysis",
    "crates/format",
    "crates/plan",
    "crates/observation",
    "crates/browser",
    "crates/browser-cdp",
    "crates/runtime",
    "crates/editor",
    "crates/lsp",
    "crates/wasm",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/webtest"

[workspace.dependencies]
webtest-text = { path = "crates/text" }
webtest-syntax = { path = "crates/syntax" }
webtest-hir = { path = "crates/hir" }
webtest-analysis = { path = "crates/analysis" }
webtest-format = { path = "crates/format" }
webtest-plan = { path = "crates/plan" }
webtest-observation = { path = "crates/observation" }
webtest-browser = { path = "crates/browser" }
webtest-browser-cdp = { path = "crates/browser-cdp" }
webtest-runtime = { path = "crates/runtime" }
webtest-editor = { path = "crates/editor" }
webtest-lsp = { path = "crates/lsp" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
tower = "0.5"
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
